# Publishes to npm when a GitHub release is published (e.g. `gh release create v0.1.2 --generate-notes`).
# Uses npm trusted publishing (OIDC): no npm token or one-time password; the package's npm settings must name
# this repository and this workflow file as its trusted publisher.
name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm with trusted publishing
        run: npm install -g npm@latest
      - name: Release tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Tag ${GITHUB_REF_NAME} != v${version} in package.json"; exit 1; }
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit
      - run: npm publish
